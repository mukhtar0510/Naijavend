<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="512" height="512">
  <title>Kwaravend</title>
  <defs>
    <linearGradient id="kv-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFC21A"/>
      <stop offset="1" stop-color="#E08F00"/>
    </linearGradient>
    <clipPath id="kv-inner"><rect x="4.5" y="4.5" width="55" height="55" rx="13.5"/></clipPath>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#kv-gold)"/>
  <g clip-path="url(#kv-inner)">
