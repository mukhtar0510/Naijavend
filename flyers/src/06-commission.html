<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="flyer.css">
<style>
.big{margin-top:60px;font:800 300px/0.9 'Sora';letter-spacing:-.06em;background:linear-gradient(180deg,#fff,#f5b301);-webkit-background-clip:text;color:transparent}
.big small{font-size:110px;letter-spacing:-.03em}
h1{margin-top:20px;font-size:76px}
.flow{display:grid;grid-template-columns:1fr auto 1fr;gap:20px;align-items:center;margin-top:48px}
.who{padding:28px;border-radius:26px;background:var(--surface);border:1px solid var(--line);text-align:center}
.who b{display:block;font:800 32px Sora}
.who span{display:block;font:500 21px Inter;color:var(--muted);margin-top:6px}
.who.seller{border-color:rgba(34,197,94,.5);background:rgba(34,197,94,.08)}
.amt{font:800 40px 'JetBrains Mono';color:var(--green);text-align:center}
.amt small{display:block;font:600 18px Inter;color:var(--muted);margin-top:6px;letter-spacing:0}
.ways{display:flex;gap:14px;margin-top:30px;flex-wrap:wrap}
</style></head><body><div class="stage grain">
<div class="top"><div class="brand"><img src="icon.png" alt=""><span>Kwara<b>vend</b></span></div><span class="tag green">No commission</span></div>
<div class="big">0<small>%</small></div>
<h1>Commission. <span class="gold">Every naira</span> is yours.</h1>
<div class="flow"><div class="who"><b>Buyer</b><span>Pays ₦24,000</span></div><div class="amt">→<small>direct</small></div><div class="who seller"><b>You</b><span>Get ₦24,000</span></div></div>
<div class="ways"><span class="pill">Bank transfer to you</span><span class="pill">Pay on delivery</span><span class="pill">Receipts checked in your dashboard</span></div>
<div class="spacer"></div>
<div class="cta-row"><span class="cta gold">Open your store, free</span><span class="url">kwaravend.ng</span></div>
<div class="foot"><span>Kwaravend · Ilorin, Kwara State</span><span>No card to start</span></div>
</div></body></html>
